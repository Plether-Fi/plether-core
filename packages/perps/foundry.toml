[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["../../lib", "../shared"]
auto_detect_remappings = false
remappings = [
    "@plether/shared/=../shared/src/",
    "@plether/perps/=src/",
    "@plether/test-utils/=../shared/test-support/",
    "@openzeppelin/contracts/=../../lib/openzeppelin-contracts/contracts/",
    "@morpho-blue/=../../lib/morpho-blue/src/",
    "forge-std/=../../lib/forge-std/src/",
]
solc = "0.8.35"
auto_detect_solc = true
optimizer = true
optimizer_runs = 200
via_ir = true

# The default matches the local quick lane. CI/audit never override these budgets.
[profile.default.fuzz]
seed = "0xdeadbeef"
runs = 256

[profile.default.invariant]
runs = 16
depth = 128
fail_on_revert = true

[profile.quick.fuzz]
runs = 256

[profile.quick.invariant]
runs = 16
depth = 128

[profile.ci.fuzz]
runs = 2000

[profile.ci.invariant]
runs = 32
depth = 256

[profile.audit.fuzz]
runs = 20000

[profile.audit.invariant]
runs = 256
depth = 1000

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"
single_line_statement_blocks = "multi"
sort_imports = true
contract_new_lines = true
