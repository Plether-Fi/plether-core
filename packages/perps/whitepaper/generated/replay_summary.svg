<polyline points="805.00,243.67 850.71,228.53 942.14,196.61 1033.57,171.25 1125.00,156.60" fill="none" stroke="#111111" stroke-width="2"/>
<text x="55" y="394" class="small">Monthly 63-day cohorts; $100m initial pool; 1.5% initial / 1% maintenance margin; 5% full-utilization carry; ECB daily fixes.</text>
<text x="55" y="412" class="small">Scenario evidence only: VPI, Pyth confidence, frozen execution, intraday paths, and keeper latency are held outside the replay.</text>
