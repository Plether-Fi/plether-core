<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Historical cohort replay summary</title>
<desc id="desc">Ending LP equity, conservatively realized carry, and cap-sensitive reserve utilization in the stylized ECB replay.</desc>
<style>
