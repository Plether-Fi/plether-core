<text x="94" y="125.55" text-anchor="end" class="label">150</text>
<line x1="104" y1="48.07" x2="926" y2="48.07" class="grid"/>
<text x="94" y="52.07" text-anchor="end" class="label">200</text>
<rect x="119.62" y="54.00" width="50.96" height="288.00" fill="#555555" stroke="#222222" stroke-width="0.5"/>
<text x="145.10" y="47.00" text-anchor="middle" class="small">+196</text>
<text x="145.10" y="357" text-anchor="end" transform="rotate(-50 145.10 357)" class="small">2023-01-06 to 2023-01-09</text>
<rect x="201.82" y="105.80" width="50.96" height="236.20" fill="#bbbbbb" stroke="#222222" stroke-width="0.5"/>
