<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
<title id="title">Largest ECB nonpublication-gap changes</title>
<desc id="desc">Ten largest absolute normalized basket moves across observation gaps of at least three calendar days.</desc>
<style>
text{font-family:'Times New Roman',Times,serif;fill:#111111}
.axis{stroke:#444444;stroke-width:1}
.grid{stroke:#dddddd;stroke-width:1}
.label{font-size:12px}
.small{font-size:10px;fill:#555555}
.title{font-size:18px;font-weight:700}
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="72" y="29" class="title">Largest reference-rate changes across 3+ day gaps</text>
<line x1="104" y1="342.00" x2="926" y2="342.00" class="grid"/>
<text x="94" y="346.00" text-anchor="end" class="label">0</text>
<line x1="104" y1="268.52" x2="926" y2="268.52" class="grid"/>
<text x="94" y="272.52" text-anchor="end" class="label">50</text>
