<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Cap sensitivity of the common-mark liability envelope</title>
<desc id="desc">Stylized maximum endpoint liability as a percentage of a 100 million dollar pool.</desc>
<style>
text{font-family:'Times New Roman',Times,serif;fill:#111111}
.axis{stroke:#444444;stroke-width:1}
.grid{stroke:#dddddd;stroke-width:1}
.label{font-size:12px}
.small{font-size:10px;fill:#555555}
.title{font-size:18px;font-weight:700}
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="72" y="29" class="title">Cap sensitivity depends on directional open interest</text>
<line x1="78" y1="356.00" x2="932" y2="356.00" class="grid"/>
<text x="68" y="360.00" text-anchor="end" class="label">0%</text>
<line x1="78" y1="296.00" x2="932" y2="296.00" class="grid"/>
<text x="68" y="300.00" text-anchor="end" class="label">20%</text>
<line x1="78" y1="236.00" x2="932" y2="236.00" class="grid"/>
<text x="68" y="240.00" text-anchor="end" class="label">40%</text>
<line x1="78" y1="176.00" x2="932" y2="176.00" class="grid"/>
<text x="68" y="180.00" text-anchor="end" class="label">60%</text>
<line x1="78" y1="116.00" x2="932" y2="116.00" class="grid"/>
<text x="68" y="120.00" text-anchor="end" class="label">80%</text>
<line x1="78" y1="56.00" x2="932" y2="56.00" class="grid"/>
<text x="68" y="60.00" text-anchor="end" class="label">100%</text>
<text x="78.00" y="378" text-anchor="middle" class="label">1.10</text>
<text x="145.42" y="378" text-anchor="middle" class="label">1.25</text>
<text x="257.79" y="378" text-anchor="middle" class="label">1.50</text>
<text x="370.16" y="378" text-anchor="middle" class="label">1.75</text>
<text x="482.53" y="378" text-anchor="middle" class="label">2.00</text>
<text x="707.26" y="378" text-anchor="middle" class="label">2.50</text>
<text x="932.00" y="378" text-anchor="middle" class="label">3.00</text>
<polyline points="78.00,266.00 145.42,266.00 257.79,266.00 370.16,243.50 482.53,206.00 707.26,131.00 932.00,56.00" fill="none" stroke="#111111" stroke-width="2" stroke-linejoin="round"/>
<circle cx="78.00" cy="266.00" r="4" fill="#111111"/>
<circle cx="145.42" cy="266.00" r="4" fill="#111111"/>
<circle cx="257.79" cy="266.00" r="4" fill="#111111"/>
<circle cx="370.16" cy="243.50" r="4" fill="#111111"/>
<circle cx="482.53" cy="206.00" r="4" fill="#111111"/>
<circle cx="707.26" cy="131.00" r="4" fill="#111111"/>
<circle cx="932.00" cy="56.00" r="4" fill="#111111"/>
<line x1="78" y1="356" x2="932" y2="356" class="axis"/>
<text x="78" y="407" class="small">Assumptions: pool $100m; entry 1.00; Long size 50m; Short size 30m. Envelope = max(30m, 50m x (cap - 1)).</text>
</svg>