name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Check formatting
        run: forge fmt --check packages test script

      - name: Check package boundaries
        run: bash scripts/check-package-boundaries.sh

      - name: Test oracle release evidence tooling
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_oracle*.py' -v

      - name: Test perps shard runner
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_perps_shards.py' -v

      - name: Build
        run: forge build --sizes --skip test

      - name: Run integration and script tests
        run: forge test --no-match-path "test/fork/*"

  package-test:
    name: Package (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [shared, spot, options, perps-aa]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Build package
        run: forge build --sizes --skip test --skip script --root packages/${{ matrix.package }}

      - name: Run package fuzz and invariant tests
        if: matrix.package != 'shared'
        run: forge test -vvv --root packages/${{ matrix.package }} --match-test "testFuzz_|invariant_"

      - name: Run package tests
        if: matrix.package != 'shared'
        run: forge test --root packages/${{ matrix.package }} --no-match-test "testFuzz_|invariant_"

  typescript-aa-client:
    name: TypeScript (perps-aa-client)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: packages/perps-aa-client
        run: npm ci

      - name: Run tests
        working-directory: packages/perps-aa-client
        run: npm test

      - name: Type-check
        working-directory: packages/perps-aa-client
        run: npm run typecheck

      - name: Build
        working-directory: packages/perps-aa-client
        run: npm run build

      - name: Check immutable package release tooling
        run: node --test scripts/perps-aa-release.test.mjs

      - name: Pack and test installed package
        run: |
          npm pack ./packages/perps-aa-client --dry-run
          node scripts/perps-aa-artifact.mjs pack "$RUNNER_TEMP/perps-aa-client"
          node scripts/perps-aa-artifact.mjs smoke "$RUNNER_TEMP/perps-aa-client"

  package-test-perps:
    name: Package (perps)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Build package
        run: bash scripts/run-with-heartbeat.sh forge build --sizes --skip test --skip script --root packages/perps

      - name: Validate suite inventory, map, and runner behavior
        run: |
          python3 scripts/check-perps-test-map.py
          python3 -m unittest discover -s scripts -p 'test_perps_runners.py'
          python3 scripts/perps-test-inventory.py > /tmp/perps-test-inventory.json

      - name: Run PR correctness and production gas/size gates
        env:
          FOUNDRY_FUZZ_SEED: '0xdeadbeef'
          HEARTBEAT_RESOURCE_DIAGNOSTICS: '1'
        run: bash scripts/run-with-heartbeat.sh bash scripts/run-perps-fast-tests.sh

      - name: Upload perps run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perps-pr-evidence-${{ github.run_id }}
          path: artifacts/perps
          if-no-files-found: warn
          retention-days: 14

  coverage-core:
    name: Coverage (core protocol)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_SRC: packages/spot/src
      FOUNDRY_TEST: packages/spot/test
      FOUNDRY_SCRIPT: integration/src
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Run coverage
        run: bash scripts/run-with-heartbeat.sh forge coverage --ir-minimum --report lcov --report-file "$GITHUB_WORKSPACE/lcov-core.raw.info" --no-match-test "testFuzz_|invariant_"

      - name: Filter coverage report
        run: awk -v scope=spot -f scripts/filter-lcov-by-scope.awk lcov-core.raw.info > lcov-core.info

      - name: Preserve coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core-${{ github.sha }}
          path: lcov-core.info
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov-core.info
          flags: core_protocol
          name: core-protocol
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  coverage-perps:
    name: Coverage (perps)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: quick
      # Smaller compiler batches preserve the same exhaustive test partition.
      # Both previous attempts lost their runner during shard 2 compilation.
      PERPS_COVERAGE_SHARDS: 8
      HEARTBEAT_RESOURCE_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install LCOV
        run: sudo apt-get update && sudo apt-get install --yes lcov

      - name: Run coverage
        run: bash scripts/run-with-heartbeat.sh bash scripts/run-perps-coverage.sh --ir-minimum --report lcov --lcov-version 1 --report-file "$GITHUB_WORKSPACE/lcov-perps.raw.info"

      - name: Upload coverage selection and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perps-coverage-evidence-${{ github.run_id }}
          path: artifacts/perps/coverage
          retention-days: 14

      - name: Filter coverage report
        run: awk -v scope=perps -f scripts/filter-lcov-by-scope.awk lcov-perps.raw.info > lcov-perps.info

      - name: Preserve coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: coverage-perps-${{ github.sha }}
          path: lcov-perps.info
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov-perps.info
          flags: perps
          name: perps
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  coverage-options:
    name: Coverage (options)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_SRC: packages/options/src
      FOUNDRY_TEST: packages/options/test
      FOUNDRY_SCRIPT: integration/src
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Run coverage
        run: bash scripts/run-with-heartbeat.sh forge coverage --ir-minimum --report lcov --report-file "$GITHUB_WORKSPACE/lcov-options.raw.info" --no-match-test "testFuzz_|invariant_"

      - name: Filter coverage report
        run: awk -v scope=options -f scripts/filter-lcov-by-scope.awk lcov-options.raw.info > lcov-options.info

      - name: Preserve coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: coverage-options-${{ github.sha }}
          path: lcov-options.info
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov-options.info
          flags: options
          name: options
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  slither:
    name: Slither (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [shared, spot, options, perps, perps-aa]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install Slither
        run: pip3 install slither-analyzer==0.11.6

      - name: Run Slither
        env:
          FOUNDRY_SRC: packages/${{ matrix.package }}/src
          FOUNDRY_TEST: integration/src
          FOUNDRY_SCRIPT: integration/src
        run: |
          slither . --config-file slither.config.json --sarif results-${{ matrix.package }}.sarif --fail-none
          test -s results-${{ matrix.package }}.sarif

      - name: Preserve static-analysis evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-${{ matrix.package }}-${{ github.sha }}
          path: results-${{ matrix.package }}.sarif
          if-no-files-found: error

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results-${{ matrix.package }}.sarif
          category: slither-${{ matrix.package }}
