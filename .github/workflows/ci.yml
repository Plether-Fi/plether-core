name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  FOUNDRY_PROFILE: ci

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Check formatting
        run: forge fmt --check packages test script

      - name: Check package boundaries
        run: bash scripts/check-package-boundaries.sh

      - name: Build
        run: forge build --sizes --skip test

      - name: Run integration and script tests
        run: forge test --no-match-path "test/fork/*"

  package-test:
    name: Package (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [shared, spot, options]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Build package
        run: forge build --sizes --skip test --skip script --root packages/${{ matrix.package }}

      - name: Run package fuzz and invariant tests
        if: matrix.package != 'shared'
        run: forge test -vvv --root packages/${{ matrix.package }} --match-test "testFuzz_|invariant_"

      - name: Run package tests
        if: matrix.package != 'shared'
        run: forge test --root packages/${{ matrix.package }} --no-match-test "testFuzz_|invariant_"

  package-test-perps-shard:
    name: Package (perps shard ${{ matrix.shard_number }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            shard_number: 1
          - shard_index: 1
            shard_number: 2
          - shard_index: 2
            shard_number: 3
          - shard_index: 3
            shard_number: 4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Build package
        run: forge build --sizes --skip test --skip script --root packages/perps

      - name: Run package test shard
        run: bash scripts/run-with-heartbeat.sh bash scripts/run-perps-package-tests.sh "${{ matrix.shard_index }}" 4

  package-test-perps:
    name: Package (perps)
    if: always()
    needs: package-test-perps-shard
    runs-on: ubuntu-latest
    steps:
      - name: Require every perps package shard
        env:
          SHARD_RESULT: ${{ needs.package-test-perps-shard.result }}
        run: test "${SHARD_RESULT}" = success

  coverage-core:
    name: Coverage (core protocol)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_SRC: packages/spot/src
      FOUNDRY_TEST: packages/spot/test
      FOUNDRY_SCRIPT: integration/src
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Run coverage
        run: bash scripts/run-with-heartbeat.sh forge coverage --ir-minimum --report lcov --report-file "$GITHUB_WORKSPACE/lcov-core.raw.info" --no-match-test "testFuzz_|invariant_"

      - name: Filter coverage report
        run: awk -v scope=spot -f scripts/filter-lcov-by-scope.awk lcov-core.raw.info > lcov-core.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov-core.info
          flags: core_protocol
          name: core-protocol
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  coverage-perps:
    name: Coverage (perps)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_SRC: packages/perps/src
      FOUNDRY_SCRIPT: integration/src
      PERPS_COVERAGE_SHARDS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install LCOV
        run: sudo apt-get update && sudo apt-get install --yes lcov

      - name: Run coverage
        run: bash scripts/run-with-heartbeat.sh bash scripts/run-perps-coverage.sh --ir-minimum --report lcov --lcov-version 1 --report-file "$GITHUB_WORKSPACE/lcov-perps.raw.info" --no-match-test "testFuzz_|invariant_|test_H01_UpdateMarkUsesPublishTime|test_GetTraderAccount_Withdrawable(Decreases|Drops)|test_Batch_SplitComponentsFitDeploymentLimits|test_AtomicLpEpoch_RuntimeFitsEip170|test_Batch_SplitComponentBindingAndRuntimeFitsEip170|test_OrderRouterCreationCodeAndConstructorArgsFitEip3860|test_SettlementMonitorLens(RuntimeFitsEip170|CreationInputFitsEip3860)|test_Batch_MaxPendingOrdersLiquidatesWithinItemGasBudget|test_Runtime_|test_Gas_|testProductionRuntimeFitsEip170|test_BatchLiquidationAppliesRiskOffRefundBeforeLiquidating|test_BatchLiquidationHonorsCutoffAdvancedDuringOracleRefund"

      - name: Filter coverage report
        run: awk -v scope=perps -f scripts/filter-lcov-by-scope.awk lcov-perps.raw.info > lcov-perps.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov-perps.info
          flags: perps
          name: perps
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  coverage-options:
    name: Coverage (options)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_SRC: packages/options/src
      FOUNDRY_TEST: packages/options/test
      FOUNDRY_SCRIPT: integration/src
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Run coverage
        run: bash scripts/run-with-heartbeat.sh forge coverage --ir-minimum --report lcov --report-file "$GITHUB_WORKSPACE/lcov-options.raw.info" --no-match-test "testFuzz_|invariant_"

      - name: Filter coverage report
        run: awk -v scope=options -f scripts/filter-lcov-by-scope.awk lcov-options.raw.info > lcov-options.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov-options.info
          flags: options
          name: options
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  slither:
    name: Slither (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [shared, spot, options, perps]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install Slither
        run: pip3 install slither-analyzer

      - name: Run Slither
        env:
          FOUNDRY_SRC: packages/${{ matrix.package }}/src
          FOUNDRY_TEST: integration/src
          FOUNDRY_SCRIPT: integration/src
        run: |
          slither . --config-file slither.config.json --sarif results-${{ matrix.package }}.sarif || true
          test -s results-${{ matrix.package }}.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results-${{ matrix.package }}.sarif
          category: slither-${{ matrix.package }}
